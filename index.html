<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="box">
      <h1>⏰Countdown Timer </h1>
        <div class="input-box">
          <input type="datetime-local" id="input">
        </div>
        <div class="output">
         <div><span id="days">00 </span><p>Days  </p></div>
         <div><span id="hours"> 00 </span><p>Hours  </p></div>
         <div><span id="minutes">00 </span><p>Minutes  </p></div>
         <div><span id="seconds">00  </span><p>Seconds</p> </div>
        </div>
        <div class="btnBox">
           <button id="start">Start Timer</button>
        </div>
        <audio id="alarmSound" preload="auto" src="ringtone.mp3"></audio>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
